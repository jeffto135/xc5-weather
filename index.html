<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <title>Weather Ticker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 鎖死高 55px、寬 1080px，內部所有物件絕對居中對齊 */
    .bar {
      width: 1080px;
      height: 55px;
      line-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center; /* 關鍵：永遠保持左右空白對稱 */
      background: rgba(0, 0, 0, 0.75);
      font-size: 30px;
      font-weight: 700;
      white-space: nowrap;
      color: #FFFFFF !important;
      padding: 0 10px;
    }

    /* 時間欄位鎖定固定寬度 145px，秒數變化時原地跳動，不影響外部居中位置 */
    .time {
      display: inline-block;
      width: 145px;
      text-align: center;
      color: #38ef7d !important;
      font-size: 34px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      margin-right: 14px;
      flex-shrink: 0;
    }

    /* 英文日期 (純白) */
    .date {
      display: inline-block;
      color: #FFFFFF !important;
      margin-right: 16px;
      font-weight: 600;
      flex-shrink: 0;
    }

    /* 溫濕度 */
    .weather-item {
      display: inline-flex;
      align-items: center;
      color: #FFFFFF !important;
      margin-right: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      flex-shrink: 0;
    }

    .weather-item span {
      color: #FFFFFF !important;
    }

    /* 一般天氣圖示 */
    .weather-icon {
      width: 44px;
      height: 44px;
      vertical-align: middle;
      margin-left: 2px;
      object-fit: contain;
      flex-shrink: 0;
    }

    /* 警告圖示容器：增減警告時自動隨同主體向兩側平分留白 */
    .warning-container {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: 8px;
      flex-shrink: 0;
    }

    .warning-icon {
      width: 44px;
      height: 44px;
      vertical-align: middle;
      object-fit: contain;
      filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.4));
    }
  </style>
</head>
<body>
  <div class="bar">
    <span id="time" class="time">--:--:--</span>
    <span id="date" class="date">-- --- ---- (---)</span>
    <span class="weather-item"><span id="temp">--</span>&#176;C</span>
    <span class="weather-item"><span id="humidity">--</span>%</span>
    
    <span class="weather-item">
      <img id="icon" class="weather-icon" src="" style="display:none;" />
    </span>

    <span id="warning-container" class="warning-container"></span>
  </div>

  <script>
    const FALLBACK_ICON = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='26' cy='26' r='12' fill='%23FFA500'/%3E%3Cpath d='M46 44a10 10 0 0 0-1.8-19.8 14 14 0 0 0-26.4 5.8A9 9 0 0 0 18 44h28z' fill='%23FFFFFF' opacity='0.9'/%3E%3C/svg%3E";

    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('time').innerText = h + ':' + m + ':' + s;

      const year = now.getFullYear();
      const monthStr = MONTHS[now.getMonth()];
      const day = now.getDate();
      const dayStr = DAYS[now.getDay()];
      
      document.getElementById('date').innerText = day + ' ' + monthStr + ' ' + year + ' (' + dayStr + ')';
    }

    let weatherSuccess = false;

    async function fetchWeather() {
      try {
        const timestamp = Date.now();
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en&_t=' + timestamp, {
          cache: 'no-store'
        });
        if (!res.ok) throw new Error('Weather API error');
        const data = await res.json();

        if (data.temperature && data.temperature.data && data.temperature.data.length > 0) {
          const hko = data.temperature.data.find(d => d.place === 'Hong Kong Observatory') || data.temperature.data[0];
          document.getElementById('temp').innerText = hko.value;
        }

        if (data.humidity && data.humidity.data && data.humidity.data.length > 0) {
          document.getElementById('humidity').innerText = data.humidity.data[0].value;
        }

        const img = document.getElementById('icon');
        if (data.icon && Array.isArray(data.icon) && data.icon.length > 0) {
          const iconId = data.icon[0];
          img.onerror = function() {
            this.onerror = null;
            this.src = FALLBACK_ICON;
          };
          img.src = './pic' + iconId + '.png';
          img.style.display = 'inline-block';
        }

        weatherSuccess = true;
      } catch (e) {
        if (!weatherSuccess) setTimeout(fetchWeather, 3000);
      }
    }

    async function fetchWarnings() {
      try {
        const timestamp = Date.now();
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=en&_t=' + timestamp, {
          cache: 'no-store'
        });
        if (!res.ok) throw new Error('Warning API error');
        const warnData = await res.json();
        const container = document.getElementById('warning-container');
        if (!container) return;

        container.innerHTML = '';
        if (!warnData || Object.keys(warnData).length === 0) return;

        const warningFiles = [];

        if (warnData.WMSGNL || warnData.WMS || warnData.SMS || warnData.WTMW) {
          warningFiles.push('sms.png');
        }

        if (warnData.WFIRE) {
          const fireCode = (warnData.WFIRE.code || '').toUpperCase();
          if (fireCode === 'WFIRER') warningFiles.push('firer.png');
          else warningFiles.push('firey.png');
        }

        if (warnData.WTCSGNL) {
          const tcCode = (warnData.WTCSGNL.code || '').toLowerCase();
          if (tcCode) warningFiles.push(tcCode + '.png');
        }

        if (warnData.WRAIN) {
          const rainCode = (warnData.WRAIN.code || '').toUpperCase();
          if (rainCode === 'WRAINB') warningFiles.push('rainb.png');
          else if (rainCode === 'WRAINR') warningFiles.push('rainr.png');
          else warningFiles.push('raina.png');
        }

        if (warnData.WTHDR) warningFiles.push('ts.png');
        if (warnData.VHOT) warningFiles.push('vhot.png');
        if (warnData.COLD) warningFiles.push('cold.png');
        if (warnData.WFROST) warningFiles.push('frost.png');
        if (warnData.WLANDSLIP) warningFiles.push('landslip.png');
        if (warnData.WFNTSA) warningFiles.push('ntfl.png');
        if (warnData.WTSUNAMI) warningFiles.push('tsunami-warn.png');

        const uniqueFiles = [...new Set(warningFiles)];
        uniqueFiles.forEach(fileName => {
          const img = document.createElement('img');
          img.className = 'warning-icon';
          img.src = './' + fileName;
          img.onerror = function() { this.style.display = 'none'; };
          container.appendChild(img);
        });

      } catch (e) {
        console.warn('Warning fetch error:', e);
      }
    }

    updateClock();
    setInterval(updateClock, 1000);

    fetchWeather();
    fetchWarnings();

    setInterval(() => {
      fetchWeather();
      fetchWarnings();
    }, 30000);
  </script>
</body>
</html>
