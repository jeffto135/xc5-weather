<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <title>Weather Ticker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang HK", sans-serif;
      color: #FFFFFF;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
    }
    .bar {
      display: inline-flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.75);
      padding: 6px 18px;
      border-radius: 4px;
      font-size: 24px;
      font-weight: 600;
      white-space: nowrap;
    }
    .time {
      color: #38ef7d;
      font-weight: 700;
      margin-right: 15px;
    }
    .date {
      color: #FFFFFF;
      margin-right: 20px;
    }
    .weather-item {
      display: inline-flex;
      align-items: center;
      margin-right: 15px;
    }
    /* 一般天氣圖示（picXX.png） */
    .weather-icon {
      width: 32px;
      height: 32px;
      vertical-align: middle;
      margin-left: 6px;
      object-fit: contain;
    }
    /* 警告圖示（對應全部警告 png） */
    .warning-icon {
      width: 34px;
      height: 34px;
      vertical-align: middle;
      margin-left: 10px;
      object-fit: contain;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.4));
    }
  </style>
</head>
<body>
  <div class="bar">
    <span id="time" class="time">--:--</span>
    <span id="date" class="date">----年--月--日 (--)</span>
    <span class="weather-item"><span id="temp">--</span>&#176;C</span>
    <span class="weather-item"><span id="humidity">--</span>%</span>
    
    <!-- 一般天氣圖示 -->
    <span class="weather-item">
      <img id="icon" class="weather-icon" src="" style="display:none;" />
    </span>

    <!-- 天氣警告圖示（生效時自動浮現，平時隱藏） -->
    <img id="warning-icon" class="warning-icon" src="" style="display:none;" />
  </div>

  <script>
    // 備用天氣圖示（SVG 太陽多雲，防破圖保險）
    const FALLBACK_ICON = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='26' cy='26' r='12' fill='%23FFA500'/%3E%3Cpath d='M46 44a10 10 0 0 0-1.8-19.8 14 14 0 0 0-26.4 5.8A9 9 0 0 0 18 44h28z' fill='%23FFFFFF' opacity='0.9'/%3E%3C/svg%3E";

    // 1. 本地即時時間更新（每秒）
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('time').innerText = h + ':' + m;

      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const day = now.getDate();
      const dayArr = ['\u65e5', '\u4e00', '\u4e8c', '\u4e09', '\u56db', '\u4e94', '\u516d'];
      document.getElementById('date').innerText = year + '\u5e74' + month + '\u6708' + day + '\u65e5 (' + dayArr[now.getDay()] + ')';
    }

    let weatherSuccess = false;

    // 2. 獲取溫濕度與一般天氣圖示 (自動加載 pic50.png ~ pic93.png)
    async function fetchWeather() {
      try {
        const timestamp = new Date().getTime();
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&_t=' + timestamp, {
          cache: 'no-store'
        });
        if (!res.ok) throw new Error('Weather API error');
        const data = await res.json();

        // 溫度
        if (data.temperature && data.temperature.data && data.temperature.data.length > 0) {
          const hko = data.temperature.data.find(d => d.place === '\u9999\u6e2f\u5929\u6587\u53f0') || data.temperature.data[0];
          document.getElementById('temp').innerText = hko.value;
        }

        // 濕度
        if (data.humidity && data.humidity.data && data.humidity.data.length > 0) {
          document.getElementById('humidity').innerText = data.humidity.data[0].value;
        }

        // 一般天氣圖示（直接讀取同目錄的 ./picXX.png）
        const img = document.getElementById('icon');
        if (data.icon && Array.isArray(data.icon) && data.icon.length > 0) {
          const iconId = data.icon[0];
          img.onerror = function() {
            this.onerror = null;
            this.src = FALLBACK_ICON;
          };
          img.src = './pic' + iconId + '.png';
          img.style.display = 'inline-block';
        }

        weatherSuccess = true;
      } catch (e) {
        console.warn('Weather fetch waiting...', e);
        if (!weatherSuccess) {
          setTimeout(fetchWeather, 3000);
        }
      }
    }

    // 3. 獲取即時天氣警告（100% 精準對齊 50 個 png 檔名）
    async function fetchWarnings() {
      try {
        const timestamp = new Date().getTime();
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc&_t=' + timestamp, {
          cache: 'no-store'
        });
        if (!res.ok) throw new Error('Warning API error');
        const warnData = await res.json();
        const warnImg = document.getElementById('warning-icon');

        if (!warnImg) return;

        // 若天文台有任何警告正在生效
        if (warnData && Object.keys(warnData).length > 0) {
          let warnSrc = '';

          // 優先級 1：熱帶氣旋警告（風球）
          if (warnData.WTCSGNL) {
            const tcCode = warnData.WTCSGNL.code;
            if (tcCode === 'TC1') warnSrc = './tc1.png';
            else if (tcCode === 'TC3') warnSrc = './tc3.png';
            else if (tcCode === 'TC8NE') warnSrc = './tc8ne.png';
            else if (tcCode === 'TC8NW') warnSrc = './tc8nw.png';
            else if (tcCode === 'TC8SE') warnSrc = './tc8se.png';
            else if (tcCode === 'TC8SW') warnSrc = './tc8sw.png';
            else if (tcCode === 'TC9') warnSrc = './tc9.png';
            else if (tcCode === 'TC10') warnSrc = './tc10.png';
            else warnSrc = './tc3.png';
          }
          // 優先級 2：暴雨警告
          else if (warnData.WRAIN) {
            const rainCode = warnData.WRAIN.code;
            if (rainCode === 'WRAINB') warnSrc = './rainb.png';
            else if (rainCode === 'WRAINR') warnSrc = './rainr.png';
            else warnSrc = './raina.png';
          }
          // 優先級 3：海嘯警告
          else if (warnData.WTSUNAMI) {
            warnSrc = './tsunami-warn.png';
          }
          // 優先級 4：雷暴警告
          else if (warnData.WTHDR) {
            warnSrc = './ts.png';
          }
          // 優先級 5：新界北部水浸特別報告
          else if (warnData.WFNTSA) {
            warnSrc = './ntfl.png';
          }
          // 優先級 6：山泥傾瀉警告
          else if (warnData.WLANDSLIP) {
            warnSrc = './landslip.png';
          }
          // 優先級 7：強烈季候風信號
          else if (warnData.WMS) {
            warnSrc = './sms.png';
          }
          // 優先級 8：酷熱 / 寒冷天氣警告
          else if (warnData.VHOT) {
            warnSrc = './vhot.png';
          }
          else if (warnData.COLD) {
            warnSrc = './cold.png';
          }
          // 優先級 9：霜凍警告
          else if (warnData.WFROST) {
            warnSrc = './frost.png';
          }
          // 優先級 10：火災危險警告（黃 / 紅）
          else if (warnData.WFIRE) {
            const fireCode = warnData.WFIRE.code;
            if (fireCode === 'WFIRER') warnSrc = './firer.png';
            else warnSrc = './firey.png';
          }

          if (warnSrc) {
            warnImg.onerror = function() {
              this.style.display = 'none'; // 找不到圖檔時自動隱藏
            };
            warnImg.src = warnSrc;
            warnImg.style.display = 'inline-block';
          } else {
            warnImg.style.display = 'none';
          }
        } else {
          // 沒有任何警告信號生效時隱藏
          warnImg.style.display = 'none';
        }
      } catch (e) {
        console.warn('Warning fetch error:', e);
      }
    }

    // 啟動定時任務
    updateClock();
    setInterval(updateClock, 1000);

    // 開機立即抓取
    fetchWeather();
    fetchWarnings();

    // 每 30 秒自動向天文台請求最新資料
    setInterval(() => {
      fetchWeather();
      fetchWarnings();
    }, 30000);
  </script>
</body>
</html>
