<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <title>Weather Ticker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang HK", sans-serif;
      color: #FFFFFF;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
    }
    /* 滿版 1080p 橫條 */
    .bar {
      width: 1080px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.75);
      font-size: 24px;
      font-weight: 600;
      white-space: nowrap;
    }
    .time {
      color: #38ef7d;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin-right: 18px;
    }
    .date {
      color: #FFFFFF;
      margin-right: 20px;
    }
    .weather-item {
      display: inline-flex;
      align-items: center;
      margin-right: 18px;
      font-variant-numeric: tabular-nums;
    }
    .weather-icon {
      width: 34px;
      height: 34px;
      vertical-align: middle;
      margin-left: 6px;
      object-fit: contain;
    }
    /* 警告容器：支援多個警告並列顯示 */
    .warning-container {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-left: 8px;
    }
    .warning-icon {
      width: 34px;
      height: 34px;
      vertical-align: middle;
      object-fit: contain;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.4));
    }
  </style>
</head>
<body>
  <div class="bar">
    <span id="time" class="time">--:--:--</span>
    <span id="date" class="date">----年--月--日 (--)</span>
    <span class="weather-item"><span id="temp">--</span>&#176;C</span>
    <span class="weather-item"><span id="humidity">--</span>%</span>
    
    <span class="weather-item">
      <img id="icon" class="weather-icon" src="" style="display:none;" />
    </span>

    <!-- 多警告動態容器 -->
    <span id="warning-container" class="warning-container"></span>
  </div>

  <script>
    const FALLBACK_ICON = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='26' cy='26' r='12' fill='%23FFA500'/%3E%3Cpath d='M46 44a10 10 0 0 0-1.8-19.8 14 14 0 0 0-26.4 5.8A9 9 0 0 0 18 44h28z' fill='%23FFFFFF' opacity='0.9'/%3E%3C/svg%3E";

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('time').innerText = h + ':' + m + ':' + s;

      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const day = now.getDate();
      const dayArr = ['\u65e5', '\u4e00', '\u4e8c', '\u4e09', '\u56db', '\u4e94', '\u516d'];
      document.getElementById('date').innerText = year + '\u5e74' + month + '\u6708' + day + '\u65e5 (' + dayArr[now.getDay()] + ')';
    }

    let weatherSuccess = false;

    async function fetchWeather() {
      try {
        const timestamp = new Date().getTime();
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&_t=' + timestamp, {
          cache: 'no-store'
        });
        if (!res.ok) throw new Error('Weather API error');
        const data = await res.json();

        if (data.temperature && data.temperature.data && data.temperature.data.length > 0) {
          const hko = data.temperature.data.find(d => d.place === '\u9999\u6e2f\u5929\u6587\u53f0') || data.temperature.data[0];
          document.getElementById('temp').innerText = hko.value;
        }

        if (data.humidity && data.humidity.data && data.humidity.data.length > 0) {
          document.getElementById('humidity').innerText = data.humidity.data[0].value;
        }

        const img = document.getElementById('icon');
        if (data.icon && Array.isArray(data.icon) && data.icon.length > 0) {
          const iconId = data.icon[0];
          img.onerror = function() {
            this.onerror = null;
            this.src = FALLBACK_ICON;
          };
          img.src = './pic' + iconId + '.png';
          img.style.display = 'inline-block';
        }

        weatherSuccess = true;
      } catch (e) {
        if (!weatherSuccess) setTimeout(fetchWeather, 3000);
      }
    }

    async function fetchWarnings() {
      try {
        const timestamp = new Date().getTime();
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc&_t=' + timestamp, {
          cache: 'no-store'
        });
        if (!res.ok) throw new Error('Warning API error');
        const warnData = await res.json();
        const container = document.getElementById('warning-container');
        if (!container) return;

        container.innerHTML = '';

        if (!warnData || Object.keys(warnData).length === 0) {
          return;
        }

        const iconsToShow = [];

        // 1. 風球 (WTCSGNL)
        if (warnData.WTCSGNL) {
          const tcCode = warnData.WTCSGNL.code;
          if (tcCode === 'TC1') iconsToShow.push('./tc1.png');
          else if (tcCode === 'TC3') iconsToShow.push('./tc3.png');
          else if (tcCode === 'TC8NE') iconsToShow.push('./tc8ne.png');
          else if (tcCode === 'TC8NW') iconsToShow.push('./tc8nw.png');
          else if (tcCode === 'TC8SE') iconsToShow.push('./tc8se.png');
          else if (tcCode === 'TC8SW') iconsToShow.push('./tc8sw.png');
          else if (tcCode === 'TC9') iconsToShow.push('./tc9.png');
          else if (tcCode === 'TC10') iconsToShow.push('./tc10.png');
          else iconsToShow.push('./tc3.png');
        }

        // 2. 暴雨 (WRAIN)
        if (warnData.WRAIN) {
          const rainCode = warnData.WRAIN.code;
          if (rainCode === 'WRAINB') iconsToShow.push('./rainb.png');
          else if (rainCode === 'WRAINR') iconsToShow.push('./rainr.png');
          else iconsToShow.push('./raina.png');
        }

        // 3. 海嘯
        if (warnData.WTSUNAMI) iconsToShow.push('./tsunami-warn.png');

        // 4. 雷暴
        if (warnData.WTHDR) iconsToShow.push('./ts.png');

        // 5. 新界北部水浸
        if (warnData.WFNTSA) iconsToShow.push('./ntfl.png');

        // 6. 山泥傾瀉
        if (warnData.WLANDSLIP) iconsToShow.push('./landslip.png');

        // 7. 強烈季候風（全面掃描所有可能鍵值：SMS, WMS, 或 JSON 字串包含 monsoon）
        const rawWarnText = JSON.stringify(warnData).toUpperCase();
        if (warnData.SMS || warnData.WMS || rawWarnText.includes('MONSOON') || rawWarnText.includes('"SMS"') || rawWarnText.includes('"WMS"')) {
          iconsToShow.push('./sms.png');
        }

        // 8. 酷熱 / 寒冷
        if (warnData.VHOT) iconsToShow.push('./vhot.png');
        if (warnData.COLD) iconsToShow.push('./cold.png');

        // 9. 霜凍
        if (warnData.WFROST) iconsToShow.push('./frost.png');

        // 10. 火災危險警告（紅 / 黃）
        if (warnData.WFIRE) {
          const fireCode = (warnData.WFIRE.code || '').toUpperCase();
          if (fireCode === 'WFIRER' || rawWarnText.includes('RED') || rawWarnText.includes('WFIRER')) {
            iconsToShow.push('./firer.png');
          } else {
            iconsToShow.push('./firey.png');
          }
        }

        // 移除重複圖示並動態加入 DOM
        const uniqueIcons = [...new Set(iconsToShow)];
        uniqueIcons.forEach(src => {
          const img = document.createElement('img');
          img.className = 'warning-icon';
          img.src = src;
          img.onerror = function() { this.style.display = 'none'; };
          container.appendChild(img);
        });

      } catch (e) {
        console.warn('Warning fetch error:', e);
      }
    }

    updateClock();
    setInterval(updateClock, 1000);

    fetchWeather();
    fetchWarnings();

    setInterval(() => {
      fetchWeather();
      fetchWarnings();
    }, 30000);
  </script>
</body>
</html>
